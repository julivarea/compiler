site_name: C-TDS Compiler
site_description: Compilador para C-TDS (TDS26) desarrollado en C con Flex y Bison
site_url: ""
repo_url: https://github.com/julivarea/compiler
repo_name: julivarea/compiler
docs_dir: documentacion
edit_uri: edit/main/documentacion/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/julivarea/compiler

theme:
  name: material
  language: es
  palette:
    # Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    # Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate

nav:
  - Inicio: index.md
  - Wiki de Onboarding:
      - Índice: wiki/00-index.md
      - 1. Primeros Pasos: wiki/00.5-getting-started.md
      - 2. Visión General y Arquitectura: wiki/01-overview.md
      - 3. Análisis Léxico: wiki/02-lexical-analysis.md
      - 4. Análisis Sintáctico: wiki/02.5-syntax-analysis.md
      - 5. Acciones del Parser: wiki/02.7-parser-actions.md
      - 6. Árbol de Sintaxis Abstracta (AST): wiki/03-ast.md
      - 7. Tabla de Símbolos y Ámbitos: wiki/04-symbol-table.md
      - 8. Chequeo de Tipos: wiki/04.5-type-checker.md
      - 9. Análisis Semántico: wiki/04-semantic-analysis.md
      - 10. Código Intermedio (TAC): wiki/05-intermediate-code.md
      - 11. Código Objeto y Stack: wiki/06-object-code.md
      - 12. Live Variable Analysis: live_variable_analysis.md
  - Documentación Técnica:
      - Alcance Análisis Semántico: analisis-semantico.md
      - Decisiones de Diseño AST: arbol_AST/decisiones_diseno_ast.md
      - Explicación Conflicto Bison: lexico-sintactico/notas/explicacion_conflicto_bison.md
      - Notas Definición AST: lexico-sintactico/notas/notes_to_ast_definition.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
