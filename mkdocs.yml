site_name: C-TDS Compiler
site_description: Compilador para C-TDS (TDS26) desarrollado en C con Flex y Bison
site_url: ""
repo_url: https://github.com/julivarea/compiler
repo_name: julivarea/compiler
docs_dir: documentacion
edit_uri: edit/main/documentacion/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/julivarea/compiler

theme:
  name: material
  language: es
  palette:
    # Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    # Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate

nav:
  - Inicio: index.md
  - Wiki de Onboarding:
      - Índice: wiki/00-index.md
      - 1. Primeros Pasos: wiki/00.5-getting-started.md
      - 2. Visión General y Arquitectura: wiki/01-overview.md
      - 3. Entrada y Línea de Comandos: wiki/01.2-cli.md
      - 4. Orquestación de las Etapas: wiki/01.4-driver.md
      - 5. Errores y Salida de Debug: wiki/01.6-errors.md
      - 6. Utilidades y Tipos Base: wiki/01.8-utilities.md
      - 7. Análisis Léxico: wiki/02-lexical-analysis.md
      - 8. Análisis Sintáctico: wiki/02.5-syntax-analysis.md
      - 9. Acciones del Parser: wiki/02.7-parser-actions.md
      - 10. Árbol de Sintaxis Abstracta (AST): wiki/03-ast.md
      - 11. Tabla de Símbolos y Ámbitos: wiki/04-symbol-table.md
      - 12. Chequeo de Tipos: wiki/04.5-type-checker.md
      - 13. Análisis Semántico: wiki/04-semantic-analysis.md
      - 14. Representación Intermedia (TAC): wiki/05-tac-representation.md
      - 15. Generación de Código Intermedio: wiki/05.5-tac-generation.md
      - 16. Análisis de Variables Vivas: wiki/05.7-live-variables.md
      - 17. Optimización del Código Intermedio: wiki/05.9-optimizer.md
      - 18. Instrucciones x86-64: wiki/06-asm-instructions.md
      - 19. Marco de Pila: wiki/06.5-stack-frame.md
      - 20. Generación de Código Objeto: wiki/06-object-code.md
  - Documentación Técnica:
      - Desacoplamiento TAC y Stack Offsets (ADR 001): decisiones/adr-001-desacoplamiento-tac-offsets-stack.md
      - Resolución O(1) de Variables Globales (ADR 002): decisiones/adr-002-resolucion-variables-globales-isglobal.md
      - Fusión de Comparaciones y Saltos (ADR 003): decisiones/adr-003-fusion-comparacion-y-salto-condicional.md
      - Alcance Análisis Semántico: analisis-semantico.md
      - Decisiones de Diseño AST: arbol_AST/decisiones_diseno_ast.md
      - Explicación Conflicto Bison: lexico-sintactico/notas/explicacion_conflicto_bison.md
      - Notas Definición AST: lexico-sintactico/notas/notes_to_ast_definition.md
      - Algoritmo de Sethi-Ullman: notas/algoritmo_sethi_ullman.md
      - Cambios a Etapas Anteriores: cambios-etapas-anteriores.md
  - Convenciones del Código:
      - Estilo y Organización: refactor.md
      - Comentarios y Doxygen: convenciones_comentarios.md
  - Bugs Resueltos:
      - Asignación a un método: bugs/asignacion_de_metodo.md
      - Doble return: bugs/doble_return.md
      - Redefinición de un parámetro: bugs/redefinicion_parametro_en_metodo.md
      - Casteos en una comparación: bugs/tipos_casteados_en_op_bin.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
